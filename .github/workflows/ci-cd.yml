name: Android CI/CD

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest
    # This tells GitHub to run all steps for this job inside the android folder
    defaults:
      run:
        working-directory: ./android

    steps:
      # Checkout happens at root, so no working directory needed for this step
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Give Permission
        run: chmod +x gradlew

      - name: Build Application
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-App
          # Updated path to include your subfolder
          path: android/app/build/outputs/apk/debug/app-debug.apk

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Give Permission
        run: chmod +x gradlew

      - name: Test Application
        run: ./gradlew test

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Android-App
          path: apk

      - name: Deploy Application
        run: echo "Application deployed successfully"
